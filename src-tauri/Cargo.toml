[package]
name = "antigravityplusplus"
version = "0.1.2"
edition = "2021"
description = "Antigravity++ - TUN-free process proxy, reversible DOM localization and context and quota rings"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "antigravityplusplus"
path = "src/main.rs"
