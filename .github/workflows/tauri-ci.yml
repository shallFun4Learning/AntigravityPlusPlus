name: Tauri Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  metadata:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate versions and release tag
        id: release
        run: node scripts/release.cjs metadata
  build:
    name: Build ${{ matrix.name }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            build-args: --no-bundle
            name: windows-x64
          - runner: macos-15
            target: aarch64-apple-darwin
            build-args: --bundles app
            name: macos-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            build-args: --bundles app
            name: macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install SQLite for Windows database regressions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install sqlite --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sqlite3 --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Backend dependencies and regressions
        run: |
          npm ci
          npm run check
          npm test
      - name: Launcher browser regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node test/launcher-browser.cjs 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test/context-browser.cjs 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test/context-browser.cjs 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe' --ide
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare self-contained runtime
        run: node scripts/prepare-tauri.cjs ${{ matrix.target }}
      - name: Include runtime license
        shell: bash
        run: curl --fail --location "https://raw.githubusercontent.com/nodejs/node/$(node -p process.version)/LICENSE" --output src-tauri/backend/NODE-LICENSE.txt
      - name: Test packaged backend without developer dependencies
        shell: bash
        run: |
          export EASYAG_TEST_NODE="$PWD/src-tauri/binaries/antigravity-node-${{ matrix.target }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then export EASYAG_TEST_NODE="$EASYAG_TEST_NODE.exe"; fi
          export EASYAG_TEST_SERVER="$PWD/src-tauri/backend/server.js"
          node test/tauri-lifecycle.test.cjs
      - name: Build native application
        run: npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} ${{ matrix.build-args }}
      - name: Package Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'AntigravityPlusPlus-${{ needs.metadata.outputs.version }}-windows-x64'
          $stage = Join-Path 'dist-tauri' $name
          New-Item -ItemType Directory -Path $stage | Out-Null
          $release = 'src-tauri/target/${{ matrix.target }}/release'
          Copy-Item -LiteralPath "$release/antigravityplusplus.exe" -Destination "$stage/AntigravityPlusPlus.exe"
          Copy-Item -LiteralPath 'src-tauri/binaries/antigravity-node-${{ matrix.target }}.exe' -Destination "$stage/antigravity-node.exe"
          Copy-Item -LiteralPath 'src-tauri/backend' -Destination "$stage/backend" -Recurse
          Get-ChildItem -LiteralPath $release -Filter '*.dll' -File | Copy-Item -Destination $stage
          Copy-Item -LiteralPath 'LICENSE','THIRD-PARTY-NOTICES.md','README.md','README.en.md','docs/PORTABLE.md' -Destination $stage
          Compress-Archive -LiteralPath $stage -DestinationPath "$name.zip"
          Expand-Archive -LiteralPath "$name.zip" -DestinationPath 'dist-tauri/verify'
          $extracted = (Resolve-Path "dist-tauri/verify/$name").Path
          foreach ($file in @('AntigravityPlusPlus.exe','antigravity-node.exe','backend/server.js','backend/index.html','backend/dicts/common.json','backend/dicts/ui_v2.json','backend/package.json','backend/node_modules/ws/package.json','backend/NODE-LICENSE.txt','backend/LICENSE','backend/THIRD-PARTY-NOTICES.md')) {
            if (-not (Test-Path -LiteralPath (Join-Path $extracted $file))) { throw "Missing portable resource: $file" }
          }
          $env:EASYAG_TEST_NODE = Join-Path $extracted 'antigravity-node.exe'
          $env:EASYAG_TEST_SERVER = Join-Path $extracted 'backend/server.js'
          node test/tauri-lifecycle.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash -LiteralPath "$name.zip" -Algorithm SHA256
      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Antigravity++.app"
          test -f "$app/Contents/Resources/backend/server.js"
          test -f "$app/Contents/Resources/backend/node_modules/ws/package.json"
          test -x "$app/Contents/MacOS/antigravity-node"
          test -f "$app/Contents/Resources/backend/LICENSE"
          test -f "$app/Contents/Resources/backend/THIRD-PARTY-NOTICES.md"
          
          # 1. 为内置 Node 运行时补充 Hardened Runtime 与 JIT 权限。
          codesign --force --options runtime --sign - --entitlements src-tauri/Entitlements.plist "$app/Contents/MacOS/antigravity-node"

          # 2. 对整个 Antigravity++.app 补充 Entitlements 签名
          codesign --force --options runtime --deep --sign - --entitlements src-tauri/Entitlements.plist "$app"

          # 3. 校验签名与 JIT 权限输出
          codesign --verify --deep --strict "$app"
          codesign -d --entitlements :- "$app/Contents/MacOS/antigravity-node"

          # 4. 关键自检：在当前 runner 上执行 V8 初始化测试，确保不会出现 SIGTRAP
          "$app/Contents/MacOS/antigravity-node" -e "console.log('antigravity-node JIT OK, V8:', process.versions.v8)"

          # 5. 打包分发 ZIP 包（保持 macOS 扩展属性、代码签名与完整 App 外壳）
          mkdir -p dist-tauri
          zip_name="AntigravityPlusPlus-${{ needs.metadata.outputs.version }}-${{ matrix.name }}-beta.zip"
          zip_path="dist-tauri/$zip_name"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip_path"

          # 6. 完整性自检：校验 ZIP 结构与中央目录，杜绝坏包
          unzip -t "$zip_path"

          # 7. 模拟解压校验关键入口与可执行权限
          verify_dir="dist-tauri/verify"
          mkdir -p "$verify_dir"
          ditto -x -k "$zip_path" "$verify_dir/"
          test -d "$verify_dir/Antigravity++.app"
          test -x "$verify_dir/Antigravity++.app/Contents/MacOS/antigravityplusplus"
          test -x "$verify_dir/Antigravity++.app/Contents/MacOS/antigravity-node"
          test -f "$verify_dir/Antigravity++.app/Contents/Resources/backend/server.js"
          rm -rf "$verify_dir"

          # 8. 输出 SHA256 校验和到日志
          shasum -a 256 "$zip_path"
      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.metadata.outputs.version }}-${{ matrix.name }}
          path: AntigravityPlusPlus-${{ needs.metadata.outputs.version }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload macOS app (Beta)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.metadata.outputs.version }}-${{ matrix.name }}
          path: dist-tauri/AntigravityPlusPlus-${{ needs.metadata.outputs.version }}-${{ matrix.name }}-beta.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload Standard Workflow Test Suite
        if: matrix.name == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityPlusPlus-${{ needs.metadata.outputs.version }}-standard-workflow-test-suite
          path: |
            test/
            core/
            features/
            adapters/
            desktop/
            ui/
            scripts/check.cjs
            scripts/backend-resources.cjs
            scripts/build-update-manifest.cjs
            scripts/release.cjs
            src-tauri/src/main.rs
            src-tauri/Cargo.toml
            src-tauri/capabilities/
            src-tauri/tauri.conf.json
            dicts/
            assets/*.png
            package.json
            package-lock.json
            update-manifest.json
            server.js
            index.html
            THIRD-PARTY-NOTICES.md
            LICENSE
            README.md
            README.en.md
            CHANGELOG.md
          retention-days: 14
      - name: Build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata-${{ matrix.name }}
          path: |
            src-tauri/Cargo.lock
            src-tauri/tauri.conf.json
          retention-days: 14
  release:
    name: Publish GitHub Release
    needs: [metadata, build]
    if: >-
      github.repository == 'shallFun4Learning/AntigravityPlusPlus' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download verified platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-${{ needs.metadata.outputs.version }}-*
          merge-multiple: true
          path: release-assets
      - name: Verify packages, generate checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.cjs publish release-assets
